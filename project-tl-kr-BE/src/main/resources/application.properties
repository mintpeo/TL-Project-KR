spring.application.name=project-tl-kr-BE
# Chạy trên máy thật: đọc khóa bí mật từ file .env ở thư mục gốc. Trong Docker: lấy từ biến môi trường.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

app.frontend.url=http://localhost:5173
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.key=${AI_SERVICE_KEY}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/project-tl-kr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

server.servlet.session.timeout=365d

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}